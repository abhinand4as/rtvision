# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtvision-tools"
version = "0.1.0"
description = "Configuration generator and entrypoint for the RTVision detection microservice"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# Allow-list only: docs/LICENSING.md §6. Ask the project owner before adding anything else.
dependencies = [
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "jsonschema>=4.18",
  "onnx>=1.15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
rtvision-run = "rtvision_tools.run:main"
rtvision-replicator = "rtvision_tools.replicator.cli:main"
rtvision-ui = "rtvision_tools.ui.server:main"

[tool.setuptools.packages.find]
where = ["tools"]
include = ["rtvision_tools*"]

[tool.setuptools.package-data]
rtvision_tools = ["templates/*.j2"]
"rtvision_tools.ui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
