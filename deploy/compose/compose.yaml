#
# Development / integration stack: apache/kafka (KRaft, single node) + rtvision.
#
#   docker compose -f deploy/compose/compose.yaml up -d --build
#   curl -s localhost:9464/ready
#
# Knobs (environment or deploy/compose/.env, see .env.example): RTVISION_IMAGE, RTVISION_MODEL,
# RTVISION_BIND, RTVISION_HOST_MODELS_DIR, RTVISION_GPU. Any rtvision.yaml scalar can be overridden
# with RTVISION__SECTION__KEY in the `environment` block below (docs/CONFIGURATION.md).
#
# The REST API (9000) is unauthenticated: ports are published on 127.0.0.1 unless RTVISION_BIND
# is set (e.g. RTVISION_BIND=0.0.0.0 on a trusted network).
name: rtvision

services:
  kafka:
    image: apache/kafka:4.3.2
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL: other containers (kafka:9092); EXTERNAL: tools on the host (localhost:9094).
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
    ports:
      - "${RTVISION_BIND:-127.0.0.1}:9094:9094"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s

  rtvision:
    image: ${RTVISION_IMAGE:-rtvision:local}
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      RTVISION_MODEL: ${RTVISION_MODEL:-rfdetr-s-coco}
      RTVISION__PUBLISH__BACKEND: kafka
      RTVISION__PUBLISH__KAFKA__BROKERS: kafka:9092
      # Set to the SPDX id of a non-permissive model licence to accept it (docs/LICENSING.md).
      RTVISION_ACCEPT_MODEL_LICENSE: ${RTVISION_ACCEPT_MODEL_LICENSE:-}
    ports:
      - "${RTVISION_BIND:-127.0.0.1}:9000:9000"
      - "${RTVISION_BIND:-127.0.0.1}:9464:9464"
    volumes:
      # Model directories (model.yaml, labels, your ONNX files). Defaults to the examples in this
      # repository; weights are never committed, add them locally (models/examples/*/README.md).
      - ${RTVISION_HOST_MODELS_DIR:-../../models/examples}:/opt/rtvision/models:ro
      # TensorRT engine cache: the first start builds the engine (minutes), later starts reuse it.
      - engines:/opt/rtvision/engines
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${RTVISION_GPU:-0}"]
              capabilities: [gpu]
    shm_size: 1gb
    # The binary exits within its shutdown watchdog (8 s by default); leave headroom before
    # Docker's SIGKILL.
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  engines:
