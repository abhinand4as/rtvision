#
# Development / integration stack: apache/kafka (KRaft, single node) + perceptra.
#
#   docker compose -f deploy/compose/compose.yaml up -d --build
#   curl -s localhost:9464/ready
#
# Knobs (environment or deploy/compose/.env, see .env.example): PERCEPTRA_IMAGE, PERCEPTRA_MODEL,
# PERCEPTRA_BIND, PERCEPTRA_HOST_MODELS_DIR, PERCEPTRA_GPU. Any perceptra.yaml scalar can be overridden
# with PERCEPTRA__SECTION__KEY in the `environment` block below (docs/CONFIGURATION.md).
#
# The REST API (9000) is unauthenticated: ports are published on 127.0.0.1 unless PERCEPTRA_BIND
# is set (e.g. PERCEPTRA_BIND=0.0.0.0 on a trusted network).
name: perceptra

services:
  kafka:
    image: apache/kafka:4.3.2
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL: other containers (kafka:9092); EXTERNAL: tools on the host (localhost:9094).
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
    ports:
      - "${PERCEPTRA_BIND:-127.0.0.1}:9094:9094"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s

  perceptra:
    image: ${PERCEPTRA_IMAGE:-perceptra:local}
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      PERCEPTRA_MODEL: ${PERCEPTRA_MODEL:-trafficcamnet-sample}
      PERCEPTRA__PUBLISH__BACKEND: kafka
      PERCEPTRA__PUBLISH__KAFKA__BROKERS: kafka:9092
      # Set to the SPDX id of a non-permissive model licence to accept it (docs/LICENSING.md).
      PERCEPTRA_ACCEPT_MODEL_LICENSE: ${PERCEPTRA_ACCEPT_MODEL_LICENSE:-}
    ports:
      - "${PERCEPTRA_BIND:-127.0.0.1}:9000:9000"
      - "${PERCEPTRA_BIND:-127.0.0.1}:9464:9464"
    volumes:
      # Model directories (model.yaml, labels, your ONNX files). Defaults to the examples in this
      # repository; weights are never committed, add them locally (models/examples/*/README.md).
      - ${PERCEPTRA_HOST_MODELS_DIR:-../../models/examples}:/opt/perceptra/models:ro
      # TensorRT engine cache: the first start builds the engine (minutes), later starts reuse it.
      - engines:/opt/perceptra/engines
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${PERCEPTRA_GPU:-0}"]
              capabilities: [gpu]
    shm_size: 1gb
    # The binary exits within its shutdown watchdog (8 s by default); leave headroom before
    # Docker's SIGKILL.
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  engines:
