# SPDX-License-Identifier: Apache-2.0
# Hand-written DeepStream main config for milestone M1 (pipeline skeleton).
# From M3 on, ds-main.ini is generated by perceptra-run; do not extend this file.
#
# The detector is the TrafficCamNet sample INSIDE the DeepStream container, referenced by path
# and never copied into this repository (docs/LICENSING.md §3). Streams are added at runtime
# through the nvmultiurisrcbin REST API on port 9000 (docs/API.md).

[application]
enable-perf-measurement=1
perf-measurement-interval-sec=5

[tiled-display]
enable=0

[source-list]
num-source-bins=0
list=
use-nvmultiurisrcbin=1
stream-name-display=1
max-batch-size=4
http-ip=0.0.0.0
http-port=9000

# Attributes applied to every source added over REST.
[source-attr-all]
enable=1
type=3
num-sources=1
gpu-id=0
cudadec-memtype=0
latency=200
rtsp-reconnect-interval-sec=10
init-rtsp-reconnect-interval-sec=5
rtsp-reconnect-attempts=-1
drop-on-latency=1

[streammux]
gpu-id=0
batch-size=4
batched-push-timeout=33000
width=1920
height=1080
enable-padding=0
nvbuf-memory-type=0
# Keep running when an individual stream ends (file sources, removed streams).
drop-pipeline-eos=1
live-source=1

[primary-gie]
enable=1
gpu-id=0
batch-size=4
interval=0
gie-unique-id=1
nvbuf-memory-type=0
config-file=/opt/nvidia/deepstream/deepstream/samples/configs/deepstream-app/config_infer_primary.txt
# Engine name nvinfer writes for batch 4 / fp16, so a second start in the same container reuses it.
model-engine-file=/opt/nvidia/deepstream/deepstream/samples/models/Primary_Detector/resnet18_trafficcamnet_pruned.onnx_b4_gpu0_fp16.engine

[tracker]
enable=1
tracker-width=960
tracker-height=544
gpu-id=0
ll-lib-file=/opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
ll-config-file=/opt/nvidia/deepstream/deepstream/samples/configs/deepstream-app/config_tracker_NvDCF_perf.yml

[osd]
enable=0

# Headless: no display; events are published by Perceptra itself (M4).
[sink0]
enable=1
type=1
sync=0
gpu-id=0
nvbuf-memory-type=0

[tests]
file-loop=0
