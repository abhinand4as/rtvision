# Generated by perceptra-run. Do not edit: change perceptra.yaml / model.yaml instead.
# service=perceptra model=rtdetr-r18-coco version=v2-r18

[application]
enable-perf-measurement=1
perf-measurement-interval-sec=5

[tiled-display]
enable=0
rows=2
columns=2
width=1280
height=720
gpu-id=0
nvbuf-memory-type=0

# Streams are added/removed at runtime through the nvmultiurisrcbin REST API.
[source-list]
num-source-bins=0
list=
use-nvmultiurisrcbin=1
stream-name-display=1
max-batch-size=4
http-ip=0.0.0.0
http-port=9000

# Attributes of every source added over REST.
[source-attr-all]
enable=1
type=3
num-sources=1
gpu-id=0
cudadec-memtype=0
latency=200
rtsp-reconnect-interval-sec=10
init-rtsp-reconnect-interval-sec=10
rtsp-reconnect-attempts=-1
drop-on-latency=1
select-rtp-protocol=4

[streammux]
gpu-id=0
batch-size=4
batched-push-timeout=33000
width=1920
height=1080
enable-padding=0
nvbuf-memory-type=0
drop-pipeline-eos=1
live-source=1

[primary-gie]
enable=1
gpu-id=0
batch-size=4
interval=0
gie-unique-id=1
nvbuf-memory-type=0
config-file=/tmp/perceptra/generated/pgie.ini

[tracker]
enable=1
tracker-width=960
tracker-height=544
gpu-id=0
ll-lib-file=/opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
ll-config-file=/opt/nvidia/deepstream/deepstream/samples/configs/deepstream-app/config_tracker_NvDCF_perf.yml

[osd]
enable=0
gpu-id=0
border-width=2
text-size=12
text-color=1;1;1;1;
text-bg-color=0.3;0.3;0.3;1
font=Serif
display-text=1
nvbuf-memory-type=0

# Headless sink (events are published by perceptra itself).
[sink0]
enable=1
type=1
sync=0
gpu-id=0
nvbuf-memory-type=0

[tests]
file-loop=0
