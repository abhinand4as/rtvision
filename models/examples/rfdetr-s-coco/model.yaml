# SPDX-License-Identifier: Apache-2.0
# COCO object detection with RF-DETR Small (Roboflow), 80 classes. Default model of the compose
# stack and the integration test. Export the ONNX first: see README.md in this folder.
schema_version: 1
name: rfdetr-s-coco
version: "rfdetr-1.12.1-small"
task: detect
license:
  spdx: Apache-2.0
  source: https://github.com/roboflow/rf-detr
  notes: "Nano/Small/Medium/Large weights are Apache-2.0; XL and 2XL are PML-1.0 (not allowed)."
files:
  onnx: rfdetr-small.onnx       # exported by tools/export/rfdetr (never committed)
  labels: labels.txt
  engine: null
  int8_calibration: null
input:
  width: 512
  height: 512
  channels: 3
  color: RGB
  # ImageNet normalisation. nvinfer has one scale factor for all channels, so 1 / (255 * 0.226)
  # approximates std (0.229, 0.224, 0.225); verified to give the same detections as rfdetr.
  scale: 0.017352806
  mean: [123.675, 116.28, 103.53]
  resize: stretch
  dynamic_batch: true
output:
  family: detr
  layers: [dets, labels]        # boxes [Q,4] then class logits [Q,91]
  box_format: cxcywh_norm
  activation: sigmoid
  has_background_class: false
  num_classes: 91               # logit index = COCO category id; labels.txt has 91 lines
classes:
  # All real COCO classes; drops the 11 unused category ids (unused_*).
  keep: [person, bicycle, car, motorcycle, airplane, bus, train, truck, boat, traffic light, fire
         hydrant, stop sign, parking meter, bench, bird, cat, dog, horse, sheep, cow,
         elephant, bear, zebra, giraffe, backpack, umbrella, handbag, tie, suitcase, frisbee,
         skis, snowboard, sports ball, kite, baseball bat, baseball glove, skateboard,
         surfboard, tennis racket, bottle, wine glass, cup, fork, knife, spoon, bowl, banana,
         apple, sandwich, orange, broccoli, carrot, hot dog, pizza, donut, cake, chair, couch,
         potted plant, bed, dining table, toilet, tv, laptop, mouse, remote, keyboard, cell
         phone, microwave, oven, toaster, sink, refrigerator, book, clock, vase, scissors,
         teddy bear, hair drier, toothbrush]
  thresholds: { default: 0.5, per_class: {} }
  topk: 300
precision: fp16
